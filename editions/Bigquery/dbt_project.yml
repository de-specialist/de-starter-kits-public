name: retail_analytics
version: '1.0.0'
config-version: 2
profile: retail_analytics

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  retail_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
    migration:
      +enabled: "{{ target.name == 'migration' and (var('enable_migration_models', false) | as_bool) }}"
      silver:
        +materialized: view
        +schema: silver
        +tags: [medallion, migration, silver]
      gold:
        +materialized: table
        +schema: gold
        +tags: [medallion, migration, gold]

query-comment:
  comment: "{{ query_comment(node) }}"
  job-label: true
