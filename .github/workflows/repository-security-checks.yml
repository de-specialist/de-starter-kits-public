name: Repository security checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests scan only the commits they add; the full working tree and the
# full Git history are scanned weekly, on release, and on manual dispatch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Independent of actionlint so a lint failure never leaves a PR's commits
  # unscanned; the diff-only scan takes seconds. Draft PRs are scanned once
  # marked ready for review.
  secret-scan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The default pull request checkout is the merge commit, whose parents are
      # the base and head commits, so the PR range is fully present.
      - name: Scan the pull request's commits with pinned Gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --log-opts="-m ${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan repository working tree with pinned Gitleaks
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          dir --redact --no-banner .
      - name: Scan full Git history with pinned Gitleaks
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner .

  # Runs on every pull request (this workflow has no path filter) so it can be a
  # required check: private pilot files, privileged workflow settings and
  # un-ignored local state never merge. Standard library only; no installs.
  public-snapshot:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the public snapshot guard
        run: python3 -m unittest -v scripts/tests/test_public_snapshot.py

  scanner-smoke-check:
    # Fail fast on pull requests: a change that does not lint never reaches the
    # scanner smoke check. Scheduled, release and manual runs check regardless.
    needs: actionlint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.actionlint.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      # On pull requests the smoke check only matters when the pinned scanner,
      # its fixtures or this workflow change; HEAD^1 is the base of the merge commit.
      - name: Detect scanner changes
        id: changes
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          if grep -qE '^(scripts/validate_gitleaks_behavior\.sh|scripts/release_archive_gitleaks.*|\.gitleaks.*|\.github/workflows/repository-security-checks\.yml)$' <<<"$changed"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Gitleaks pin or fixture changes; skipping the scanner smoke check.'
          fi
      - name: Check pinned Gitleaks behavior with temporary synthetic fixtures
        if: steps.changes.outputs.run == 'true'
        run: scripts/validate_gitleaks_behavior.sh
