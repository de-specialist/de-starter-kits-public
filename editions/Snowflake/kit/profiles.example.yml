# Target identifiers have no defaults: dbt stops if any is unset.
# Point them only at a disposable Terraform target, for example
#   SNOWFLAKE_DATABASE=DBT_KIT_DEV_<suffix>_DB
#   SNOWFLAKE_SCHEMA=DBT_KIT_DEV_<suffix>_SCHEMA
#   SNOWFLAKE_WAREHOUSE=DBT_KIT_DEV_<suffix>_WH
# using the same <suffix> for all three (see infra/terraform outputs).
reliable_pipeline:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: false
      query_tag: "{{ env_var('SNOWFLAKE_QUERY_TAG', 'de_starter_snowflake') }}"
    migration:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('MIGRATION_SNOWFLAKE_ROLE', 'DBT_MIGRATION_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('MIGRATION_DBT_SCHEMA', 'STARTERKIT_MIGRATION') }}"
      threads: 4
      client_session_keep_alive: false
      query_tag: "{{ env_var('SNOWFLAKE_QUERY_TAG', 'de_starter_snowflake_migration') }}"
