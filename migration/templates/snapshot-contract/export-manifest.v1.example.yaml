# Export manifest - EXAMPLE, format version 1. MOCK values only.
#
# First delivery of MOCK period 2026-01. The source writes one manifest per
# snapshot, after the data files (rule C1). File names are relative to the
# manifest's directory. Dates, timestamps and decimals are quoted strings.

manifest_format_version: 1
mock_only: true

contract:
  id: MOCK_widget_readings_snapshot
  revision: 1

snapshot:
  snapshot_id: MOCK_widget_readings_2026-01_seq1  # unique, never reused (D5)
  period: "2026-01"
  period_start: "2026-01-01"                      # inclusive
  period_end: "2026-02-01"                        # exclusive
  sequence: 1                                     # 1 on first delivery, then +1 per correction (L2)
  supersedes: null
  correction_reason: null
  approved_exception_ref: null                    # only for a correction to a closed period (L4)
  as_of_utc: "2026-02-03T02:00:00Z"               # point in time the source was read
  exported_at_utc: "2026-02-03T02:04:00Z"
  status: complete                                # complete | failed

empty_period:
  declared: false
  reason_code: null

files:
  - name: mock/MOCK_widget_readings_2026-01_seq1.csv
    bytes: 353
    sha256: 508e66a55133c7ba9a2c0af5693aed39255fdbc4ba1308af7a748f2cc289dba9
    row_count: 5                                  # data rows, header excluded

totals:
  row_count: 5
  source_row_count: 5                             # counted at the source at as_of_utc (C3)
  distinct_key_count: 5                           # equals row_count when D1 holds
  control_totals:
    reading_value_sum: "32.50"
    reading_value_non_null_count: 4
