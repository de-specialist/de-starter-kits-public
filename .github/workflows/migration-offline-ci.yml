name: Migration offline tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sole owner of the migration/tests suite. Repository script tests run
# scripts/tests only, so each suite runs once per pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'migration/**'
      - 'docs/source-snapshot-contract.md'
      - '.github/workflows/migration-offline-ci.yml'
      - '.github/actions/locked-venv/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Restore cached migration-tests venv
        id: venv
        uses: ./.github/actions/locked-venv
        with:
          name: migration-tests
          lock: migration/tests-requirements-lock.txt
      - name: Install hash-locked migration test dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check --require-hashes -r migration/tests-requirements-lock.txt
      - name: Run offline migration tests
        run: CI=true python -m unittest discover -s migration/tests -v
