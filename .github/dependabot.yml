version: 2
# Monthly, one grouped pull request per ecosystem and directory for minor and
# patch bumps; major bumps stay separate pull requests. This keeps update batches
# reviewable and avoids unnecessary CI churn.
updates:
  - package-ecosystem: pip
    directory: /editions/Bigquery
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Upstream pins make these bumps uninstallable. Remove each rule once the
    # named dependencies relax their pins so Dependabot proposes the bump again.
    ignore:
      # google-genai requires tenacity<9.2.0.
      - dependency-name: tenacity
        versions: [">=9.2"]
      # dbt-common and dbt-core require pathspec<1.1.
      - dependency-name: pathspec
        versions: [">=1.1"]
      # dbt-adapters and dbt-core require mashumaro<3.18.
      - dependency-name: mashumaro
        versions: [">=3.18"]
      # dbt-common requires agate<1.10.
      - dependency-name: agate
        versions: [">=1.10"]
      # google-cloud-aiplatform requires google-genai<2.0.0.
      - dependency-name: google-genai
        versions: [">=2.0"]
      # google-genai requires websockets<17.0.
      - dependency-name: websockets
        versions: [">=17.0"]
      # dbt-bigquery requires google-cloud-storage<3.2.
      - dependency-name: google-cloud-storage
        versions: [">=3.2"]

  - package-ecosystem: pip
    directory: /editions/Snowflake
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Upstream pins make these bumps uninstallable. Remove each rule once the
    # named dependencies relax their pins so Dependabot proposes the bump again.
    ignore:
      # dbt-common and dbt-core require pathspec<1.1.
      - dependency-name: pathspec
        versions: [">=1.1"]
      # dbt-adapters and dbt-core require mashumaro<3.18.
      - dependency-name: mashumaro
        versions: [">=3.18"]
      # dbt-common requires agate<1.10.
      - dependency-name: agate
        versions: [">=1.10"]

  - package-ecosystem: pip
    directory: /migration
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /editions/Bigquery/infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /editions/Snowflake/infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
