name: reliable_pipeline
version: '1.0.0'
config-version: 2
profile: reliable_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  reliable_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: table
    migration:
      +enabled: "{{ target.name == 'migration' and (var('enable_migration_models', false) | as_bool) }}"
      silver:
        +materialized: view
        +schema: silver
        +tags: [medallion, migration, silver]
      gold:
        +materialized: table
        +schema: gold
        +tags: [medallion, migration, gold]

seeds:
  reliable_pipeline:
    +quote_columns: false
