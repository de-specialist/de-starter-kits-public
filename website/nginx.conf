server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static docs site + embedded dbt docs SPAs under */dbt-docs/.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
